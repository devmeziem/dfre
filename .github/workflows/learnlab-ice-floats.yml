name: LearnLab — Why Ice Floats

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learnlab-ice-floats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install free rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg fonts-dejavu-core libegl1 libgl1 libxrender1 libxi6 libxkbcommon0
          python3 -m pip install --user --upgrade edge-tts

      - name: Validate lesson seed and scripts
        run: |
          python3 -m json.tool learnlab/seeds/why_ice_floats.json > /dev/null
          python3 -m py_compile learnlab/scripts/make_narration.py learnlab/scripts/validate_output.py

      - name: Generate narration and captions
        run: |
          mkdir -p output/learnlab
          python3 learnlab/scripts/make_narration.py learnlab/seeds/why_ice_floats.json output/learnlab

      - name: Render procedural 3D lesson
        run: |
          DURATION=$(python3 -c 'import json; print(json.load(open("output/learnlab/duration.json"))["duration_seconds"])')
          blender --background --factory-startup --python learnlab/blender/render_ice_lesson.py -- \
            --seed learnlab/seeds/why_ice_floats.json \
            --output output/learnlab/scene-silent.mp4 \
            --duration "$DURATION"

      - name: Assemble and validate final vertical video
        run: |
          ffmpeg -hide_banner -y \
            -i output/learnlab/scene-silent.mp4 \
            -i output/learnlab/narration.wav \
            -vf "subtitles=output/learnlab/captions.srt:force_style='FontName=DejaVu Sans,FontSize=32,PrimaryColour=&H00FFFFFF,OutlineColour=&H00101010,BorderStyle=1,Outline=3,Shadow=1,Alignment=2,MarginV=90'" \
            -map 0:v:0 -map 1:a:0 \
            -c:v libx264 -preset veryfast -crf 21 -pix_fmt yuv420p \
            -c:a aac -b:a 160k -shortest -movflags +faststart \
            output/learnlab/why-ice-floats.mp4
          python3 learnlab/scripts/validate_output.py \
            output/learnlab/why-ice-floats.mp4 \
            learnlab/seeds/why_ice_floats.json

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnlab-why-ice-floats
          path: |
            output/learnlab/why-ice-floats.mp4
            output/learnlab/narration.wav
            output/learnlab/captions.srt
            learnlab/seeds/why_ice_floats.json
          if-no-files-found: error
          retention-days: 7
