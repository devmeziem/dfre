name: EDUFORGE StickLab - 3D Stickman

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "StickLab scene seed"
        required: true
        default: "sticklab/seeds/first_test.json"
  push:
    branches: [main]
    paths:
      - "sticklab/**"
      - ".github/workflows/sticklab.yml"

permissions:
  contents: read

jobs:
  render-sticklab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEED_FILE: ${{ github.event.inputs.seed || 'sticklab/seeds/first_test.json' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg fonts-dejavu-core libegl1 libgl1 libxrender1 libxi6 libxkbcommon0
          python3 -m pip install --user --upgrade edge-tts
      - name: Validate seed
        run: python3 -m json.tool "$SEED_FILE" > /dev/null
      - name: Render Blender animation
        run: |
          mkdir -p output/sticklab
          blender --background --factory-startup --python sticklab/blender/render.py -- --seed "$SEED_FILE" --output output/sticklab/scene-silent.mp4
      - name: Generate narration and captions
        run: python3 scripts/make_narration.py "$SEED_FILE" output/sticklab
      - name: Assemble final video
        run: |
          ffmpeg -y -i output/sticklab/scene-silent.mp4 -i output/sticklab/narration.mp3             -vf "subtitles=output/sticklab/captions.srt:force_style='FontName=DejaVu Sans,FontSize=18,PrimaryColour=&H00FFFFFF,OutlineColour=&H00101010,BorderStyle=1,Outline=3,Shadow=1,Alignment=2,MarginV=145'"             -map 0:v:0 -map 1:a:0 -c:v libx264 -preset veryfast -crf 21 -pix_fmt yuv420p             -c:a aac -b:a 160k -shortest -movflags +faststart output/sticklab/sticklab-test.mp4
      - name: Validate final video
        run: |
          test -s output/sticklab/sticklab-test.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/sticklab/sticklab-test.mp4
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduforge-sticklab-room-test
          path: |
            output/sticklab/sticklab-test.mp4
            output/sticklab/narration.mp3
            output/sticklab/captions.srt
          if-no-files-found: error
          retention-days: 7
