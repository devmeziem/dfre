name: Presenter Facial Rig
on:
  workflow_dispatch:
  push:
    branches: [presenter-lab-preview]
    paths:
      - "presenter-lab/blender/build_facial_rig.py"
      - "presenter-lab/assets/Presenter.glb"
      - ".github/workflows/presenter-lab.yml"

permissions:
  contents: read

jobs:
  build-facial-rig:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libxrender1 libxi6 libxkbcommon0
      - name: Check character asset
        run: test -s presenter-lab/assets/Presenter.glb
      - name: Build facial controls and preview stills
        run: |
          mkdir -p output/presenter
          blender --background --factory-startup --python presenter-lab/blender/build_facial_rig.py
      - name: Validate facial rig outputs
        run: |
          test -s output/presenter/Presenter_Facial_Rig.blend
          test -s output/presenter/Presenter_Facial_Rig.glb
          test -s output/presenter/facial-controls-report.json
          test -s output/presenter/facial-frame-01.png
          test -s output/presenter/facial-frame-12.png
          test -s output/presenter/facial-frame-42.png
          python3 - <<'PY'
          import json
          p='output/presenter/facial-controls-report.json'
          data=json.load(open(p))
          expected={'Blink_L','Blink_R','Smile','Mouth_Open','Brow_Raise'}
          assert expected.issubset(set(data['controls'])), data
          print('Validated facial controls:', ', '.join(data['controls']))
          PY
      - name: Upload facial rig
        uses: actions/upload-artifact@v4
        with:
          name: presenter-facial-rig
          path: output/presenter/
          if-no-files-found: error
          retention-days: 14
