name: Crypto Opportunity Telegram Digest

on:
  schedule:
    - cron: "0 9 * * *" # Daily at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-telegram-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and post opportunities
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          CRYPTO_OPPORTUNITY_FEEDS: ${{ vars.CRYPTO_OPPORTUNITY_FEEDS }}
          DAILY_POST_LIMIT: "10"
        run: node scripts/crypto-opportunity-digest.mjs
