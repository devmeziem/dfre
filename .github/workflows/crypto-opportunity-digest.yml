name: Crypto Opportunity Telegram Digest

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8,12,16,20 * * *" # Four runs daily (09:00, 13:00, 17:00, 21:00 Nigeria time)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-telegram-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and post opportunities
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          POST_LIMIT: "2"
        run: node scripts/crypto-opportunity-digest.mjs
