name: Render short

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed JSON path"
        required: true
        default: "seeds/solar_eclipse.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eduforge-3d-test.yml"
      - "blender/**"
      - "seeds/**"
      - "scripts/make_narration.py"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SEED_FILE: ${{ github.event.inputs.seed || (github.event_name == 'push' && 'seeds/earwax.json' || 'seeds/solar_eclipse.json') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg fonts-dejavu-core libegl1 libgl1 libxrender1 libxi6 libxkbcommon0
          python3 -m pip install --user --upgrade edge-tts

      - name: Validate seed
        run: python3 -m json.tool "$SEED_FILE" > /dev/null

      - name: Render scene
        run: |
          mkdir -p output
          blender --background --factory-startup --python blender/render_short.py -- \
            --seed "$SEED_FILE" \
            --output "output/scene-silent.mp4"

      - name: Generate narration and captions
        run: python3 scripts/make_narration.py "$SEED_FILE" output

      - name: Assemble final video
        run: |
          ffmpeg -y -i output/scene-silent.mp4 -i output/narration.mp3 \
            -vf "subtitles=output/captions.srt:force_style='FontName=DejaVu Sans,FontSize=18,PrimaryColour=&H00FFFFFF,OutlineColour=&H00101010,BorderStyle=1,Outline=3,Shadow=1,Alignment=2,MarginV=145'" \
            -map 0:v:0 -map 1:a:0 -c:v libx264 -preset veryfast -crf 21 \
            -pix_fmt yuv420p -c:a aac -b:a 160k -shortest \
            -movflags +faststart output/eduforge-short.mp4

      - name: Validate output
        run: |
          test -s output/eduforge-short.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/eduforge-short.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 output/eduforge-short.mp4 | grep -q aac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduforge-short
          path: |
            output/eduforge-short.mp4
            output/narration.mp3
            output/captions.srt
          if-no-files-found: error
          retention-days: 7
