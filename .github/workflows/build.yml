name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      story:
        description: 'Story idea or title'
        required: false
        default: 'The Last Signal'
      genre:
        description: 'Genre'
        required: false
        default: 'mystery'
      duration:
        description: 'Target duration in seconds'
        required: false
        default: '45'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORY_PROVIDER: cloudflare
      MEDIA_PROVIDER: real
      IMAGE_PROVIDER: huggingface
      VOICE_PROVIDER: edge
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STORY_MODEL: ${{ secrets.STORY_MODEL }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      IMAGE_MODEL: ${{ secrets.IMAGE_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Write run idea
        env:
          STORY: ${{ inputs.story || 'The Last Signal' }}
          GENRE: ${{ inputs.genre || 'mystery' }}
          DURATION: ${{ inputs.duration || '45' }}
        run: |
          node -e "const fs=require('fs'); const x={title:process.env.STORY,genre:process.env.GENRE,durationSeconds:Number(process.env.DURATION)}; fs.writeFileSync('stories/run.json',JSON.stringify(x,null,2));"

      - name: Build MP4
        run: npm run render -- stories/run.json

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: output/final.mp4
          if-no-files-found: error
