name: DFRE - Standalone Cinematic Short Pipeline

# Movie-brand episodic pipeline adapted for DFRE.
# It generates the cinematic short, verifies the MP4, and archives the result.

on:
  workflow_dispatch:
    inputs:
      story:
        description: 'Story idea or episode title'
        required: true
        default: 'The Second Lunch'
        type: string
      genre:
        description: 'Genre'
        required: true
        default: 'emotional human story'
        type: string
      duration:
        description: 'Target duration in seconds'
        required: true
        default: '90'
        type: string
      auto_publish:
        description: 'Publish externally (not configured in DFRE yet)'
        required: true
        default: false
        type: boolean
      dry_run:
        description: 'Dry Run Mode'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  STORY_PROVIDER: cloudflare
  MEDIA_PROVIDER: real
  IMAGE_PROVIDER: cloudflare
  VOICE_PROVIDER: edge
  EDGE_TTS_LANG: 'en-US'
  EDGE_TTS_VOICE_NARRATOR: 'en-US-GuyNeural'
  EDGE_TTS_RATE: '-8%'
  EDGE_TTS_VOLUME: 'default'
  EDGE_TTS_PITCH: '-18Hz'
  EDGE_TTS_TIMEOUT_MS: 120000
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-4b'
  CLOUDFLARE_IMAGE_TIMEOUT_SECONDS: 180
  IMAGE_WIDTH: 512
  IMAGE_HEIGHT: 896
  STORY_MODEL: '@cf/meta/llama-3.3-70b-instruct-fp8-fast'

jobs:
  movie_brand_pipeline:
    name: Build & Render Standalone Cinematic Short
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Standalone Short Status
        env:
          AUTO_PUBLISH: ${{ inputs.auto_publish }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "=== 🎬 DFRE Standalone Cinematic Short ==="
          echo "External publishing requested: $AUTO_PUBLISH"
          echo "Dry run: $DRY_RUN"
          echo "DFRE currently builds and archives the video; external publishing is not wired into this repository."

      - name: Validate pipeline
        run: npm run validate

      - name: Write episode seed
        env:
          STORY: ${{ inputs.story }}
          GENRE: ${{ inputs.genre }}
          DURATION: ${{ inputs.duration }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const duration = Number(process.env.DURATION);
          if (!Number.isFinite(duration) || duration < 5 || duration > 120) {
            throw new Error('Duration must be between 5 and 120 seconds');
          }
          const x = {
            title: process.env.STORY,
            genre: process.env.GENRE,
            durationSeconds: duration,
          };
          fs.mkdirSync('stories', { recursive: true });
          fs.writeFileSync('stories/run.json', JSON.stringify(x, null, 2));
          NODE

      - name: Build standalone cinematic MP4
        run: npm run render -- stories/run.json

      - name: Verify standalone video
        run: |
          test -s output/final.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/final.mp4

      - name: Write standalone manifest
        env:
          STORY: ${{ inputs.story }}
          GENRE: ${{ inputs.genre }}
          RUN_ID: ${{ github.run_id }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = {
            pipeline: 'DFRE',
            format: 'standalone-cinematic-short',
            title: process.env.STORY,
            genre: process.env.GENRE,
            runId: process.env.RUN_ID,
            artifact: 'final.mp4'
          };
          fs.writeFileSync('output/movie_episode_manifest.json', JSON.stringify(manifest, null, 2));
          NODE

      - name: Archive Movie Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dfre-cinematic-short-${{ github.run_id }}
          path: |
            output/final.mp4
            output/movie_episode_manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Pipeline Summary
        if: always()
        run: |
          echo "==============================================================="
          echo "DFRE STANDALONE CINEMATIC SHORT PIPELINE COMPLETED"
          echo "Video artifact: dfre-cinematic-short-${{ github.run_id }}"
          echo "DFRE video generation is complete."
          echo "External publishing remains intentionally unconfigured."
          echo "==============================================================="
